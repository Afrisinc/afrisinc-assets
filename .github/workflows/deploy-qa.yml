name: Deploy Afrisinc Assets - qa

on:
  push:
    branches: 
      - develop

jobs:
  # ── Lint ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  # ── Test ─────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB:       afrisinc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/afrisinc_test?sslmode=disable
      API_KEY:      test-api-key
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /tmp/afrisinc-test-uploads
      ASSET_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Run migrations
        run: psql $DATABASE_URL -f migrations/001_init.sql

      - name: Run tests
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  # ── Build check ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -trimpath -o /dev/null ./cmd/server

      - name: Build Docker image (smoke test)
        run: docker build --target production -t afrisinc/assets:ci-test .

  # ── Deploy to QA ─────────────────────────────────────────────────
  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set image tags
      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "qa_tag=qa" >> $GITHUB_OUTPUT

      # Step 3: Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 4: Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/afrisinc-assets:${{ steps.meta.outputs.short_sha }} \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/afrisinc-assets:${{ steps.meta.outputs.qa_tag }} \
            --target production .
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/afrisinc-assets:${{ steps.meta.outputs.short_sha }}
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/afrisinc-assets:${{ steps.meta.outputs.qa_tag }}

      # Step 5: Deploy to QA VPS via SSH
      - name: Deploy to QA VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/afrisinc-assets/qa"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            docker compose -p assets-qa --env-file .env.qa -f docker-compose.yml pull
            docker compose -p assets-qa --env-file .env.qa -f docker-compose.yml up -d
            docker image prune -af
            docker compose -p assets-qa --env-file .env.qa -f docker-compose.yml ps
