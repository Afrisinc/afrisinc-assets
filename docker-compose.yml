version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Afrisinc Asset Server — Production Compose
#  Usage:
#    cp .env.example .env          # fill in secrets
#    docker compose up -d          # start everything
#    docker compose logs -f server # tail logs
# ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: afrisinc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-afrisinc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-afrisinc_assets}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro  # auto-runs on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afrisinc} -d ${POSTGRES_DB:-afrisinc_assets}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    # Never expose 5432 to the host in production
    expose:
      - "5432"

  # ── Asset Server ───────────────────────────────────────────────
  server:
    build:
      context: .
      target: production          # uses the scratch stage
    image: afrisinc/assets:${TAG:-latest}
    container_name: afrisinc_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_ADDR:       ":8080"
      DATABASE_URL:      "postgres://${POSTGRES_USER:-afrisinc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-afrisinc_assets}?sslmode=disable"
      STORAGE_DRIVER:    "${STORAGE_DRIVER:-local}"
      STORAGE_LOCAL_ROOT: "/data/uploads"
      ASSET_BASE_URL:    "${ASSET_BASE_URL}"
      API_KEY:           "${API_KEY}"
      UPLOAD_MAX_MB:     "${UPLOAD_MAX_MB:-50}"
      # S3 (uncomment when STORAGE_DRIVER=s3)
      # S3_ENDPOINT:     "${S3_ENDPOINT}"
      # S3_BUCKET:       "${S3_BUCKET}"
      # S3_REGION:       "${S3_REGION:-auto}"
      # S3_ACCESS_KEY:   "${S3_ACCESS_KEY}"
      # S3_SECRET_KEY:   "${S3_SECRET_KEY}"
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Nginx reverse proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: afrisinc_nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads_data:/data/uploads:ro      # serve static files directly
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot (SSL — run once then renews via cron) ──────────────
  certbot:
    image: certbot/certbot:latest
    container_name: afrisinc_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - frontend

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local

networks:
  backend:
    internal: true          # postgres is never reachable from outside
  frontend:
    driver: bridge
